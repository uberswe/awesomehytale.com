apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: awesomehytale-com-prod-tls
  namespace: awesomehytale-com-prod
spec:
  secretName: awesomehytale-com-prod-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - awesomehytale.com
    - www.awesomehytale.com
