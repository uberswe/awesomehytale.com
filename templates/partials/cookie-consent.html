{{define "cookie-consent"}}
<div id="cookie-banner" class="cookie-banner" style="display: none;">
    <div class="cookie-content">
        <p>We use cookies to analyze site traffic and improve your experience. By accepting, you consent to our use of cookies.</p>
        <div class="cookie-buttons">
            <button onclick="acceptCookies()" class="cookie-accept">Accept</button>
            <button onclick="declineCookies()" class="cookie-decline">Decline</button>
        </div>
    </div>
</div>
{{end}}
