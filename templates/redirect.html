<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - Awesome Hytale</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --accent-cyan: #00bcd4;
            --accent-orange: #ff9800;
            --text-primary: #e6edf3;
            --text-muted: #8b949e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .redirect-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        
        h1 {
            margin-bottom: 1rem;
            color: var(--accent-cyan);
        }
        
        .countdown {
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent-orange);
            margin: 2rem 0;
        }
        
        .destination {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .buttons {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: var(--accent-cyan);
            color: var(--bg-primary);
        }
        
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--accent-cyan);
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .warning {
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h1>You are leaving Awesome Hytale</h1>
        <p>Redirecting to external site in:</p>
        <div class="countdown" id="countdown">10</div>
        <p>Destination:</p>
        <div class="destination">{{.TargetURL}}</div>
        
        <div class="buttons">
            <a href="{{.TargetURL}}" class="btn btn-primary" id="continueBtn">Continue Now</a>
            <a href="{{.BackURL}}" class="btn btn-secondary">Go Back</a>
        </div>
        
        <p class="warning">We are not responsible for the content of external websites.</p>
    </div>
    
    <script>
        var seconds = 10;
        var countdown = document.getElementById('countdown');
        var continueBtn = document.getElementById('continueBtn');
        var targetURL = '{{.TargetURL}}';
        
        var timer = setInterval(function() {
            seconds--;
            countdown.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = targetURL;
            }
        }, 1000);
        
        continueBtn.addEventListener('click', function(e) {
            clearInterval(timer);
        });
    </script>
</body>
</html>
