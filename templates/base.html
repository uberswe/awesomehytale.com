{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Meta.Title}}</title>
    <meta name="description" content="{{.Meta.Description}}">
    <link rel="canonical" href="{{.Meta.CanonicalURL}}">
    
    <!-- Open Graph -->
    <meta property="og:type" content="{{.Meta.OGType}}">
    <meta property="og:url" content="{{.Meta.CanonicalURL}}">
    <meta property="og:title" content="{{.Meta.Title}}">
    <meta property="og:description" content="{{.Meta.Description}}">
    <meta property="og:image" content="{{.Meta.OGImage}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Awesome Hytale">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{.Meta.Title}}">
    <meta name="twitter:description" content="{{.Meta.Description}}">
    <meta name="twitter:image" content="{{.Meta.OGImage}}">
    
    {{if eq .Meta.PageType "search"}}
    <meta name="robots" content="noindex">
    {{end}}
    
    <link rel="stylesheet" href="/static/css/style.css">
    
    {{template "jsonld" .}}
</head>
<body>
    {{template "header" .}}
    
    <div class="layout">
        {{template "sidebar" .}}
        
        <main class="content">
            {{template "content" .}}
        </main>
    </div>
    
    {{template "footer" .}}
    {{template "cookie-consent" .}}
    
    <script>
    // Cookie consent handling
    (function() {
        var consent = localStorage.getItem('cookieConsent');
        var banner = document.getElementById('cookie-banner');
        
        if (consent === 'accepted') {
            loadGoogleAnalytics();
        } else if (consent !== 'declined' && banner) {
            banner.style.display = 'flex';
        }
        
        window.acceptCookies = function() {
            localStorage.setItem('cookieConsent', 'accepted');
            if (banner) banner.style.display = 'none';
            loadGoogleAnalytics();
        };
        
        window.declineCookies = function() {
            localStorage.setItem('cookieConsent', 'declined');
            if (banner) banner.style.display = 'none';
        };
        
        function loadGoogleAnalytics() {
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=G-D7PW41MLMN';
            document.head.appendChild(script);
            
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-D7PW41MLMN');
        }
    })();
    </script>
</body>
</html>
{{end}}
